services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: oma_academy
      POSTGRES_USER: oma
      POSTGRES_PASSWORD: oma_dev_password
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
