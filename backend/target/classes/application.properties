spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oma_academy}
spring.datasource.username=${DB_USER:oma}
spring.datasource.password=${DB_PASSWORD:oma_dev_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Секрет JWT: минимум 32 символа. В продакшене задавайте только через переменную окружения.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars}
app.jwt.ttl-hours=12
# Адреса, с которых разрешены запросы (где открыт фронтенд)
app.cors.origins=${CORS_ORIGINS:http://localhost:5500,http://localhost:8000,http://localhost:3000}
