spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oma_academy}
spring.datasource.username=${DB_USER:oma}
spring.datasource.password=${DB_PASSWORD:oma_dev_password}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# Секрет JWT: минимум 32 символа.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars}
app.jwt.ttl-hours=12

# Разрешенные CORS origins (React SPA фронтенд)
app.cors.origins=${CORS_ORIGINS:http://localhost:5500,http://localhost:8000,http://localhost:3000,http://localhost:5173}
